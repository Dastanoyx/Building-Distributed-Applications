# A Service is a stable name and IP in front of the pods that are READY.
# This is DNS-based discovery: other services call http://catalog-service:8081 (Session 07).
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
spec:
  selector:
    app: catalog-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081
