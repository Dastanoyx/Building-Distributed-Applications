# Prometheus PULLS metrics: each service exposes /actuator/prometheus and this file
# tells Prometheus where to look (Session 11).
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: orderflow
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - gateway:8080
          - catalog-service:8081
          - order-service:8082
          - notification-service:8083
          - payment-service:8084
